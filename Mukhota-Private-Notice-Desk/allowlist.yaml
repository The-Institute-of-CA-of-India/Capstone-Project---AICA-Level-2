# Mukhota - DO NOT REDACT list. Editable here or in Settings.
#
# patterns          : a detected item (or the whole word/token around it) that fully
#                     matches one of these regular expressions is never redacted.
# context_patterns  : an item preceded (within ~25 characters) by one of these is
#                     never redacted (e.g. the notice's Document Identification Number).
# department_patterns: low-confidence name hits (spaCy, officer lines) containing these
#                     are ignored.
# words             : generic words / names that are never redacted.

patterns:
  # Sections, rules, sub-sections:  Section 143(2), u/s 148A, Rule 86A, 73(1)
  - '(?i)(?:u/?s\.?|sec(?:tion)?s?\.?|rule|r\.)?\s*\d{1,3}[A-Z]{0,3}(?:\s*\(\s*\w{1,4}\s*\))*'
  # Notification / circular numbers:  01/2017-Central Tax, 183/15/2022-GST, 37/2024
  - '(?i)(?:no\.?\s*)?\d{1,4}(?:/\d{1,4}){1,3}(?:\s*-\s*[A-Za-z() ]{2,30})?'
  # Assessment year / financial year / tax period:  AY 2024-25, FY 2023-2024, 2022-23
  - '(?i)(?:a\.?\s?y\.?|f\.?\s?y\.?)?\s*(?:19|20)\d{2}\s*[-–/]\s*(?:19|20)?\d{2}'
  - '(?i)(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s,\-]*(?:19|20)\d{2}'
  # Dates:  12/03/2024, 12-03-24, 12.03.2024, 12th March 2024, 2024-03-12
  - '\d{1,2}[./-]\d{1,2}[./-]\d{2,4}'
  - '(?:19|20)\d{2}-\d{2}-\d{2}'
  - '(?i)\d{1,2}(?:st|nd|rd|th)?\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*,?\s+(?:19|20)\d{2}'
  # Amounts (only with currency or Indian/Western comma grouping or decimals; bare digit runs are NOT allowed)
  - '(?i)(?:rs\.?|inr|₹)\s*[\d,]+(?:\.\d{1,2})?(?:/-)?'
  - '\d{1,3}(?:,\d{2})*,\d{3}(?:\.\d{1,2})?(?:/-)?'
  - '\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?(?:/-)?'
  - '\d+\.\d{2}'
  # Notice Document Identification Numbers (CBIC / ITBA / GST portal) - please check against your notices
  - '(?i)CBIC-?DIN-?[A-Z0-9 ]{8,30}'
  - '(?i)ITBA/[A-Z]{2,6}/[A-Z]{1,3}/[\w()]+/\d{4}-\d{2}/\d{6,12}(?:\(\d+\))?'
  - '20\d{4}[A-Z0-9]{2}[A-Z]{2}\d{6,10}'
  # Proceeding / reference / ARN numbers
  - '(?i)(?:ZD|ZA|AA)\d{2}\d{4}[A-Z0-9]{6,9}'
  - '(?i)ITBA/[\w/()\-]+'
  # Form names:  GST DRC-01, ASMT-10, Form 26AS, ITR-6, GSTR-3B, REG-17
  - '(?i)(?:form\s*)?(?:gst\s*)?(?:drc|asmt|reg|rfd|apl|adt|mov|gstr|itr|itns|cmp|pmt|inv)[\s-]?\d{1,3}[A-Z]?'
  - '(?i)form\s*(?:no\.?\s*)?\w{1,6}'
  - '(?i)26AS|AIS|TIS|3CD|3CA|3CB'

context_patterns:
  - '(?i)document\s+identification\s+(?:number|no\.?)\s*[:\-]?\s*$'
  - '(?i)\bCBIC[-\s]?DIN\s*[:\-]?\s*$'
  - '(?i)\b(?:reference|ref\.?)\s*(?:no\.?|number)\s*[:\-]?\s*$'
  - '(?i)\bARN\s*(?:no\.?)?\s*[:\-]?\s*$'
  - '(?i)\b(?:notice|order|proceeding|case)\s*(?:no\.?|number|id)\s*[:\-]?\s*$'
  - '(?i)\b(?:section|sec\.?|u/s|rule|notification|circular)\s*(?:no\.?)?\s*[:\-]?\s*$'

department_patterns:
  - '(?i)\b(?:department|ministry|government|commissionerate|directorate|board|tribunal|court|cbic|cbdt|gstn)\b'
  - '(?i)\b(?:income\s*tax|goods\s+and\s+services\s+tax|central\s+tax|state\s+tax|customs|excise)\b'
  - '(?i)\b(?:office\s+of|o/o)\b'
  - '(?i)\b(?:faceless|e-?filing|e-?proceeding|assessment\s+unit|penalty\s+unit|nfac)\b'

words:
