<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A6E">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KT AP Suite">
  <title>{% block title %}KnowTaxx AP Suite{% endblock %} | KnowTaxx</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-user-id="{{ current_user.id if current_user.is_authenticated else '' }}">
  <div class="app">
    {% include 'components/_sidebar.html' %}
    <div class="main">
      {% include 'components/_topbar.html' %}
      <main class="content">
        {% include 'components/_flash.html' %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% include 'components/_ios_install.html' %}
  <script src="{{ url_for('static', filename='js/sw-register.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
