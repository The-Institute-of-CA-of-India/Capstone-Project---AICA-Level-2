{% extends 'base.html' if current_user.is_authenticated else 'base_public.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card card-accent">
  <h1>{{ title }}</h1>
  <p class="muted" style="margin-top:8px">{{ message }}</p>
  <a class="btn btn-primary" href="/">Go to home</a>
</div>
{% endblock %}
