{% for q in questions %}<fieldset class="quiz-question"><legend><span>{{ loop.index }}</span> {{ q.prompt }}</legend>{% set qi=loop.index0 %}{% for option in q.options %}<label class="quiz-option"><input required type="radio" name="q{{ qi }}" value="{{ loop.index0 }}"><span>{{ option }}</span></label>{% endfor %}</fieldset>{% endfor %}<input type="hidden" name="csrf" value="{{ csrf }}">
