<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Redactor PRO</title>
<link rel="icon" type="image/svg+xml" href="/static/brand/logo.svg">
<meta name="author" content="CA Lucika Mehta">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app" class="no-batch">
  <header id="top">
    <div class="brand"><img class="brand-logo" src="/static/brand/logo.svg" alt="" width="26" height="26"><span class="brand-name">PDF Redactor</span><span class="pro">PRO</span><span class="byline">by CA Lucika Mehta</span></div>
    <div class="top-stats" id="top-stats"></div>
    <div class="top-spacer"></div>
    <button class="tbtn ghost" id="btn-contact" title="Contact us"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v12H8l-4 3z"/><path d="M8 9h8M8 13h5"/></svg><span class="lbl">Contact us</span></button>
    <button class="tbtn ghost" id="btn-settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="lbl">Settings</span></button>
    <button class="tbtn hidden" id="btn-new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New batch</button>
    <button class="tbtn hidden" id="btn-records" title="Certificate, log and label key - keep on this computer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l3 3v15H6z"/><path d="M9 12l2 2 4-4"/></svg>Records</button>
    <button class="tbtn primary hidden" id="btn-download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</button>
  </header>

  <aside id="left">
    <div class="pane-head">
      <div class="pane-title"><span>Files</span><span class="muted num" id="file-count"></span></div>
      <input class="search" id="file-search" placeholder="Find a file" aria-label="Find a file">
      <div class="filters" id="file-filters">
        <button data-f="all" class="on">All</button><button data-f="attention">To check</button><button data-f="edited">Edited</button>
      </div>
    </div>
    <div id="file-list" role="listbox" aria-label="Files in this batch"></div>
  </aside>

  <main id="main">
    <div id="composer"></div>
    <div id="workspace" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div id="toolbar">
        <div class="tgroup" role="group" aria-label="View">
          <button class="ibtn on" data-view="redacted" title="Redacted result (R)">Redacted</button>
          <button class="ibtn" data-view="original" title="Original with redaction marks (O)">Original</button>
          <button class="ibtn" data-view="split" title="Side by side (S)">Side by side</button>
        </div>
        <div class="tgroup" role="group" aria-label="Tool">
          <button class="ibtn on" data-tool="select" title="Select: click a box to switch it on or off (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 8-6 2-3 6z"/></svg>Select</button>
          <button class="ibtn" data-tool="draw" title="Draw a redaction box (D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="10" rx="1"/><path d="M4 12h16" stroke-dasharray="2 2"/></svg>Draw box</button>
        </div>
        <button class="ibtn" id="btn-marks" title="Outline every redaction (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="1" stroke-dasharray="3 2"/></svg>Outlines</button>
        <div class="tspacer"></div>
        <div class="pageno"><button class="ibtn" id="pg-prev" title="Previous page (←)">‹</button><input id="pg-in" aria-label="Page"><span id="pg-total"></span><button class="ibtn" id="pg-next" title="Next page (→)">›</button></div>
        <div class="tgroup"><button class="ibtn" id="z-out" title="Zoom out (−)">−</button><span class="zoomval" id="z-val">100%</span><button class="ibtn" id="z-in" title="Zoom in (+)">+</button><button class="ibtn" id="z-fit" title="Fit width (0)">Fit</button></div>
      </div>
      <div id="pending" class="hidden">
        <span class="ptext" id="pending-text"></span>
        <button id="btn-discard">Discard</button>
        <button class="go" id="btn-apply">Apply to this file <span class="muted" style="color:#AEB7C3">Ctrl+Enter</span></button>
      </div>
      <div id="viewer" tabindex="0"></div>
    </div>
  </main>

  <aside id="right">
    <div class="tabs" role="tablist">
      <button data-tab="items" class="on">Items<span class="count" id="items-count"></span></button>
      <button data-tab="add">Add</button>
      <button data-tab="details">Details</button>
    </div>
    <div class="tabbody" id="tab-items"></div>
    <div class="tabbody hidden" id="tab-add"></div>
    <div class="tabbody hidden" id="tab-details"></div>
  </aside>

  <footer id="status">
    <span class="lock"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Processed on this computer only</span>
    <span id="status-msg"></span>
    <span class="grow"></span>
    <span class="sb-keys"><kbd>D</kbd> draw <kbd>V</kbd> select <kbd>←</kbd><kbd>→</kbd> page <kbd>J</kbd><kbd>K</kbd> file <kbd>+</kbd><kbd>−</kbd> zoom <kbd>Del</kbd> remove box</span>
    <span class="sb-ver" id="ver"></span>
  </footer>
</div>

<div id="scrim" class="hidden"></div>
<aside id="drawer" class="closed" aria-label="Settings"></aside>
<div id="progress" class="hidden"><div class="prog-card"><h3 id="prog-stage">Reading files</h3><div class="pfile" id="prog-file"></div><div class="bar"><i id="prog-bar"></i></div><div class="pcount"><span id="prog-count"></span><span>Files stay on this computer</span></div></div></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="file-input" multiple class="hidden">
<script src="/static/app.js"></script>
</body>
</html>
