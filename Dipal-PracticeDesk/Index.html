<style>

letter-spacing:1.8px;text-transform:uppercase;color:var(--green);font-weight:750}.topbar .eyebrow{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.local{font-size:12px;color:var(--green);background:#eaf4ef;border-radius:20px;padding:6px 12px}.page{padding:30px 36px 40px;max-width:1650px;margin:auto}h1{font-size:30px;line-height:1.2;letter-spacing:-1px;margin:7px 0 9px}h2{font-size:19px;margin:0}h3{font-size:15px;margin:0 0 9px}p{margin:0 0 12px}.muted{color:var(--muted)}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px}.stat .number{font-size:32px;line-height:1.3;font-weight:700;margin:10px 0 3px;letter-spacing:-1px}.stat .label{font-size:12px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;margin-bottom:22px}.card-head{padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.card-body{padding:22px}.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:22px}.badge{display:inline-flex;align-items:center;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap}.b-red{color:#9d3434;background:#fbecec}.b-amber{color:#8b5c0d;background:#fff4da}.b-green{color:#216c57;background:#e9f5ed}.b-gray{color:#607278;background:#eef2f3}.demo-banner{background:#fff5df;color:#80581b;padding:9px 36px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.notice{border:1px solid #d3e7dd;background:#eef7f1;padding:14px 18px;border-radius:9px;margin-bottom:20px;color:#325a4c;font-size:13px}.warning{background:#fff4e6;border-color:#f0d29b;color:#815619}.filters{display:flex;gap:10px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line)}input,select,textarea{border:1px solid #cad8d3;background:#fff;border-radius:7px;padding:9px 11px;color:var(--ink);max-width:100%}.filters input{min-width:210px;flex:1}.filters select{max-width:230px}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:#fafcfb;padding:12px 18px;border-bottom:1px solid var(--line)}td{padding:15px 18px;border-bottom:1px solid #edf1ef;vertical-align:middle}tr:last-child td{border:0}td small{display:block;color:var(--muted);margin-top:3px}.table-wrap{overflow:auto}td .link{padding:0;border:0;color:var(--green);background:none;text-align:left;font-weight:650}.progress{height:5px;background:#e7eeea;border-radius:9px;margin-top:7px;overflow:hidden;min-width:80px}.progress span{height:100%;background:#368e74;display:block}.empty{padding:40px 24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}.list-item{padding:15px 22px;border-bottom:1px solid #edf1ef;display:flex;align-items:center;justify-content:space-between;gap:12px}.list-item:last-child{border-bottom:0}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.details-meta{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0;color:var(--muted);font-size:13px}.details-meta strong{color:var(--ink)}.back{margin-bottom:18px}.docname{min-width:190px}.doc-note{font-size:12px;max-width:260px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin-top:4px}.status-select{font-size:12px;padding:6px;min-width:140px}.due-input{font-size:12px;padding:6px;width:131px}.dialog{border:0;border-radius:15px;padding:0;width:min(620px,94vw);max-height:90vh;color:var(--ink);box-shadow:0 20px 80px #102a3440}dialog::backdrop{background:#0d242a88}.dialog-head{padding:21px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-body{padding:24px}.dialog-foot{padding:16px 24px;background:#f8faf9;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin-bottom:16px}.field label{font-size:12px;font-weight:650}.field small{color:var(--muted);font-size:12px}.full{grid-column:1/-1}.field textarea{resize:vertical;min-height:90px}.checkline{display:flex;gap:8px;align-items:center;margin-bottom:14px}.checkline input{width:auto}.reminder-text{width:100%;height:320px;resize:vertical;line-height:1.6;font-size:13px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#153e35;color:white;padding:12px 22px;border-radius:8px;box-shadow:0 4px 20px #0002;z-index:100;max-width:90vw}.guide p,.guide li{line-height:1.8}.guide ul,.guide ol{padding-left:22px}.save-error{background:#fde8e8;color:#902c2c;padding:12px 24px;font-weight:600}.foot{font-size:11px;color:var(--muted);margin-top:26px;display:flex;justify-content:space-between;gap:16px}.count-chip{font-size:12px;color:var(--muted)}.activity{font-size:12px}.activity strong{font-size:13px}.activity time{color:var(--muted);font-size:11px}.client-contact{overflow-wrap:anywhere}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.form-error{color:#b03333;font-size:13px;padding:0 24px 14px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1100px){.grid2{grid-template-columns:1fr}.shell{grid-template-columns:190px 1fr}.page{padding:25px}.topbar{padding:18px 25px}.stats{gap:10px}.stat{padding:16px}}@media(max-width:760px){.shell{display:block}aside{height:auto;position:static;padding:16px;gap:16px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:8px 12px}.brand-sub,.side-bottom{display:none}.topbar{padding:14px 16px;flex-wrap:wrap}.page{padding:20px 16px}.stats{grid-template-columns:1fr 1fr}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.top-actions{flex-wrap:wrap}.demo-banner{padding:9px 16px}.foot{flex-direction:column}h1{font-size:26px}}@media print{aside,.topbar,.demo-banner,.no-print,.back,.row-actions,.filters,.toolbar,.toast,dialog,.foot{display:none!important}.shell{display:block}.page{padding:0}.card{break-inside:avoid;border-radius:0}.stats{gap:8px}.stat{padding:10px}body{background:white;font-size:11px}td,th{padding:8px}.status-select,.due-input{border:0;padding:0;appearance:none}h1{font-size:23px}}

<body>
<div id="save-error" class="save-error" hidden role="alert"></div>
<div class="shell"><aside><div><div class="brand"><span class="brand-mark">P</span>PracticeDesk</div><div class="brand-sub">CLIENT OPERATIONS</div></div><nav aria-label="Main navigation"><button data-nav="overview" class="active">◫ &nbsp; Overview</button><button data-nav="assignments">▤ &nbsp; Assignments</button><button data-nav="clients">▦ &nbsp; Clients</button><button data-nav="guide">? &nbsp; Quick guide</button></nav><div class="side-bottom"><strong>Less chasing.<br>More practising.</strong>A clear view of every client document.<br><button data-act="backup">Export backup</button><div style="margin-top:20px">Created by Dipal<br>Capstone · AICA Level 2</div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Your practice, organised</div><div id="today-label" style="font-size:12px;margin-top:3px"></div></div><div class="top-actions"><span class="local">● Local workspace</span><button data-act="backup" class="small">Backup</button><button data-act="restore" class="small">Restore</button><button data-act="assignment-new" class="primary">+ New assignment</button></div></header><div id="demo-banner"></div><div id="app" class="page"></div></main></div>
<dialog id="modal" class="dialog" aria-labelledby="modal-title"></dialog><div id="toast" class="toast" role="status" hidden></div><input type="file" id="restore-file" accept="application/json,.json" hidden>
<script>
'use strict';
const VERSION=1,KEY='practicedesk.live.v1',DEMO_KEY='practicedesk.demo.v1';
const STATUS=['Pending','Partially received','Received','Reviewed','Not applicable'];
const TEMPLATES={
 'Statutory audit':['Trial balance','Financial statements / draft financials','General ledger','Bank statements and reconciliations','Sales and purchase registers','Fixed asset register','Inventory statement and valuation','Receivables and payables ageing','Borrowing statements and confirmations','Statutory dues reconciliation','Related party details','Management representations'],
 'Income tax return':['PAN and basic taxpayer details','Previous-year return and computation','Form 16 / income certificates, if applicable','AIS / TIS and Form 26AS','Bank statements','Interest certificates','Capital gains statements, if applicable','Deduction and exemption supporting documents','Business financials, if applicable','Tax payment challans'],
 'GST review':['Outward supply register','Purchase register','GSTR-1 data','GSTR-3B data','GSTR-2B data','Credit and debit note register','Electronic ledgers','ITC reconciliation and supporting records','E-way bill data, where relevant'],
 'Monthly bookkeeping':['Sales invoices','Purchase and expense bills','Bank statements','Cash book and petty cash vouchers','Payroll summary','Loan and interest statements','Supporting documents for adjustments'],
 'Custom':[]
};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function shift(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function date(v){return v?new Date(v+'T12:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'Not set'}
function validDate(s){if(typeof s!=='string')return false;if(s==='')return true;if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||s<'1900-01-01'||s>'2200-12-31')return false;let d=new Date(s+'T12:00:00');return !isNaN(d)&&d.getFullYear()===+s.slice(0,4)&&d.getMonth()+1===+s.slice(5,7)&&d.getDate()===+s.slice(8,10)}
function blank(){return {version:VERSION,settings:{firm:'Your CA Practice',sender:'Practice Team'},clients:[],assignments:[],activity:[]}}
function validate(s){
 if(!s||s.version!==VERSION||!s.settings||typeof s.settings.firm!=='string'||typeof s.settings.sender!=='string'||!Array.isArray(s.clients)||!Array.isArray(s.assignments)||!Array.isArray(s.activity))throw Error('This is not a supported PracticeDesk backup.');
 const ids=new Set();const unique=v=>{if(typeof v!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(v)||ids.has(v))throw Error('Invalid or duplicate record ID.');ids.add(v)};
 for(const c of s.clients){unique(c.id);for(const k of ['name','contact','email','phone'])if(typeof c[k]!=='string')throw Error('Invalid client record.');if(!c.name.trim())throw Error('A client name is missing.')}
 const clients=new Set(s.clients.map(c=>c.id));
 for(const a of s.assignments){unique(a.id);if(!clients.has(a.clientId)||!Array.isArray(a.docs)||!validDate(a.due)||!a.title?.trim())throw Error('Invalid assignment record.');for(const k of ['title','period','owner','notes','created'])if(typeof a[k]!=='string')throw Error('Invalid assignment field.');for(const d of a.docs){unique(d.id);if(!d.name?.trim()||!STATUS.includes(d.status)||!validDate(d.due)||!validDate(d.receivedOn)||typeof d.notes!=='string'||typeof d.required!=='boolean')throw Error('Invalid document record.')}}
 for(const a of s.activity)if(!a||typeof a.text!=='string'||typeof a.at!=='string'||isNaN(Date.parse(a.at)))throw Error('Invalid activity record.');
 return s;
}
function seed(){let s=blank();s.settings={firm:'Dipal & Associates · Demo',sender:'Dipal'};s.clients=[{id:id(),name:'Aravalli Infrastructure Pvt. Ltd.',contact:'Meera Shah',email:'meera@example.com',phone:''},{id:id(),name:'Narmada Trading Co.',contact:'Rohan Patel',email:'rohan@example.com',phone:''},{id:id(),name:'Kavya Design Studio',contact:'Kavya Desai',email:'kavya@example.com',phone:''}];
 function assignment(i,title,type,period,due,owner,statuses){return {id:id(),clientId:s.clients[i].id,title,period,due,owner,notes:'Fictional sample data for demonstration.',created:new Date().toISOString(),docs:TEMPLATES[type].map((n,j)=>({id:id(),name:n,required:true,status:statuses[j]||'Pending',due,receivedOn:['Received','Reviewed'].includes(statuses[j])?today():'',notes:j===3?'Awaiting remaining supporting records.':''}))}}
 s.assignments=[assignment(0,'Annual statutory audit','Statutory audit','FY 2025–26',shift(-3),'Dipal',['Reviewed','Received','Received','Partially received','Pending','Reviewed']),assignment(1,'GST reconciliation review','GST review','October 2026',shift(3),'Aditi',['Reviewed','Received','Received','Pending','Partially received']),assignment(2,'Monthly bookkeeping','Monthly bookkeeping','October 2026',shift(7),'Dipal',['Reviewed','Reviewed','Received','Pending'])];s.activity=[{at:new Date().toISOString(),text:'Demo workspace created with fictional clients and assignments.'}];return s;
}
let demo=false,state=blank(),view='overview',active=null,filters={q:'',status:'all',client:'all'},toastTimer;
// Google Edition does not load live browser storage.
function persist(){if(window.loadFailed&&!demo)return false;try{localStorage.setItem(demo?DEMO_KEY:KEY,JSON.stringify(state));$('#save-error').hidden=true;return true}catch(e){$('#save-error').hidden=false;$('#save-error').textContent='Changes are only in memory: browser storage is unavailable or full. Export a backup now before closing this page.';return false}}
function commit(text){if(text){state.activity.unshift({at:new Date().toISOString(),text});state.activity=state.activity.slice(0,500)}persist();render()}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4000)}
function client(a){return state.clients.find(c=>c.id===a.clientId)}
function outstanding(d){return d.required&&!['Received','Reviewed','Not applicable'].includes(d.status)}
function dueFor(a,d){return d.due||a.due}
function overdue(a,d){const due=dueFor(a,d);return outstanding(d)&&due&&due<today()}
function openDocs(a){return a.docs.filter(outstanding)}
function counts(a){let relevant=a.docs.filter(d=>d.required&&d.status!=='Not applicable'),received=relevant.filter(d=>['Received','Reviewed'].includes(d.status));return {total:relevant.length,received:received.length,pending:openDocs(a).length,overdue:a.docs.filter(d=>overdue(a,d)).length,review:relevant.filter(d=>d.status==='Received').length}}
function stage(a){let c=counts(a);if(!c.total)return 'No requirements';if(c.pending===0)return c.review?'Ready for review':'Checklist complete';return c.overdue?'Overdue':'Awaiting documents'}
function badge(s){return `<span class="badge ${s==='Overdue'?'b-red':s==='Checklist complete'||s==='Reviewed'?'b-green':s==='Awaiting documents'||s==='Pending'||s==='Partially received'?'b-amber':'b-gray'}">${esc(s)}</span>`}
function filteredAssignments(){return state.assignments.filter(a=>{let q=filters.q.toLowerCase();return (!q||[a.title,a.period,a.owner,client(a)?.name].join(' ').toLowerCase().includes(q))&&(filters.client==='all'||a.clientId===filters.client)&&(filters.status==='all'||stage(a)===filters.status)})}
function stat(label,n,desc,color=''){return `<div class="stat"><div class="label">${label}</div><div class="number" style="color:${color||'var(--ink)'}">${n}</div><div class="label">${desc}</div></div>`}
function pageHead(eyebrow,title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="muted">${sub}</p></div><div class="toolbar no-print">${actions}</div></div>`}
function assignmentRows(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Client / assignment</th><th>Owner</th><th>Internal due</th><th>Documents received</th><th>Status</th><th></th></tr></thead><tbody>${list.map(a=>{let c=counts(a);return `<tr><td><button class="link" data-open="${a.id}">${esc(client(a)?.name)}</button><small>${esc(a.title)} · ${esc(a.period||'Period not set')}</small></td><td>${esc(a.owner||'Unassigned')}</td><td>${date(a.due)}${c.overdue?`<small style="color:var(--red)">${c.overdue} overdue document${c.overdue===1?'':'s'}</small>`:''}</td><td>${c.received} / ${c.total}<div class="progress"><span style="width:${c.total?Math.round(c.received/c.total*100):0}%"></span></div></td><td>${badge(stage(a))}</td><td class="no-print"><button class="small" data-open="${a.id}">Open →</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>No assignments to show</strong>Create an assignment or adjust your filters.</div>`}
function filterBar(){return `<div class="filters no-print"><label class="sr-only" for="search">Search assignments</label><input id="search" value="${esc(filters.q)}" placeholder="Search client, assignment or owner…"><label class="sr-only" for="client-filter">Filter by client</label><select id="client-filter"><option value="all">All clients</option>${state.clients.map(c=>`<option value="${c.id}" ${c.id===filters.client?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label class="sr-only" for="status-filter">Filter by status</label><select id="status-filter">${['all','Overdue','Awaiting documents','Ready for review','Checklist complete','No requirements'].map(s=>`<option value="${s}" ${s===filters.status?'selected':''}>${s==='all'?'All statuses':s}</option>`).join('')}</select></div>`}
function overview(){let all=state.assignments,docs=all.flatMap(a=>a.docs.map(d=>({a,d}))),pending=docs.filter(x=>outstanding(x.d)),late=docs.filter(x=>overdue(x.a,x.d));return pageHead('Practice overview','Every document. In view.','Track client requirements, clear pending items and keep assignments moving.',`<button data-act="csv">Export register</button><button data-act="assignment-new" class="primary">+ New assignment</button>`)+(!all.length?`<div class="notice">Start with a client and an assignment, or explore the fictional demo workspace. <button class="small" data-act="demo">Explore demo</button></div>`:'')+`<div class="stats">${stat('ACTIVE CLIENTS',new Set(all.map(a=>a.clientId)).size,`${state.clients.length} clients in your directory`)}${stat('ASSIGNMENTS',all.length,'Across your practice')}${stat('AWAITING DOCUMENTS',pending.length,'Required · pending or partial')}${stat('OVERDUE DOCUMENTS',late.length,'Internal due date has passed','var(--red)')}</div><div class="grid2"><section class="card"><div class="card-head"><div><h2>Needs attention</h2><span class="count-chip">Outstanding requirements, earliest due first</span></div></div>${pending.length?pending.sort((x,y)=>(dueFor(x.a,x.d)||'9999').localeCompare(dueFor(y.a,y.d)||'9999')).slice(0,6).map(({a,d})=>`<div class="list-item"><div><button class="link" style="border:0;padding:0;color:var(--green);background:none;text-align:left" data-open="${a.id}">${esc(d.name)}</button><div class="muted" style="font-size:12px">${esc(client(a)?.name)} · ${date(dueFor(a,d))}</div></div>${badge(overdue(a,d)?'Overdue':d.status)}</div>`).join(''):`<div class="empty">No outstanding requirements.</div>`}</section><section class="card"><div class="card-head"><h2>Recent activity</h2></div>${state.activity.length?state.activity.slice(0,5).map(x=>`<div class="list-item activity"><div><strong>${esc(x.text)}</strong><br><time>${new Date(x.at).toLocaleString('en-IN')}</time></div></div>`).join(''):'<div class="empty">Your updates will appear here.</div>'}</section></div><section class="card"><div class="card-head"><h2>Assignment register</h2><button class="small no-print" data-nav="assignments">View all →</button></div>${assignmentRows(all.slice(0,6))}</section>`}
function assignments(){return pageHead('Assignment register','Keep every engagement moving.','Internal collection dates help your team prioritise follow-ups.',`<button data-act="csv">Export register</button><button class="primary" data-act="assignment-new">+ New assignment</button>`)+`<section class="card">${filterBar()}<div id="assignment-results">${assignmentRows(filteredAssignments())}</div></section>`}

function guide(){return pageHead('Getting started','A calmer document follow-up routine.','PracticeDesk · Client Document Pendency Manager · Version 1.0',`<button data-act="demo">Explore demo</button><button data-act="settings">Practice settings</button>`)+`<div class="grid2 guide"><section class="card"><div class="card-head"><h2>Your daily workflow</h2></div><div class="card-body"><ol><li><strong>Add a client</strong> with a contact person and optional email / phone.</li><li><strong>Create an assignment</strong>, choose a starter checklist, enter a period, owner and internal collection date.</li><li><strong>Tailor the checklist</strong>: edit requirements, mark optional items and set document-specific dates.</li><li><strong>Update receipt status</strong>. Use Partially received and record what is still missing in notes. Received awaits your team's review; Reviewed records that review.</li><li><strong>Draft a reminder</strong>. Check the wording, copy it and send through your normal email or messaging app.</li><li><strong>Export a backup</strong> at the end of the day. Restore replaces the current workspace after confirmation.</li></ol><h3>How dates and completion work</h3><p>Dates are internal document collection targets, not statutory deadlines. A required item is overdue when its effective due date is before today and its status is Pending or Partially received. An item without a date is not overdue.</p><p>A document-specific date overrides the assignment date. Changing an assignment date does not change existing document-specific dates. A blank document date inherits the assignment date. Optional items and Not applicable items are excluded from required counts and reminders.</p><p>All required documents received means Ready for review. All required documents reviewed means Checklist complete. With no applicable required documents, the assignment shows No requirements.</p><h3>Starter checklists</h3><p>Audit, income tax, GST and bookkeeping lists are editable starting points. Assess applicability and completeness for each engagement; they are not statutory compliance checklists.</p></div></section><section class="card"><div class="card-head"><h2>Data, privacy & demo</h2></div><div class="card-body"><p><strong>No installation or internet required.</strong> Open this HTML file in a current desktop Edge or Chrome browser. There are no external fonts, analytics, API calls or automatic messages.</p><p>Records are stored in this browser's local storage. This is a single-user prototype with no login, encryption or shared database. Anyone with access to this browser profile can access its records. Use fictional data for the capstone demonstration.</p><p>Use the same file path and browser profile. Moving or renaming the file, private browsing, changing browser or clearing browser data can make saved records unavailable. Keep JSON backups in a controlled location.</p><p>Document contents are not uploaded or stored. This app tracks document requirements, receipt status and notes only. Avoid recording sensitive identifiers in notes.</p><p><strong>Demo mode is separate</strong> from the live workspace. All demo names and contacts are fictional. Exit demo to return to your own records.</p><p>Recent activity is a convenience history, retained for the latest 500 updates. It is editable through backups and is not a tamper-proof audit trail.</p><h3>Where AI fits</h3><p>This delivered version uses deterministic checklist tracking and reminder templates. It makes no live AI calls. AI-assisted development can be explained in your capstone; do not present reminder templates as a live AI model.</p><h3>Exports</h3><p>CSV exports the full document register, including source client, assignment, owner, dates, status and notes. JSON backup preserves all records and practice settings. Review reminders before sending; saving a draft does not record a sent message.</p></div></section></div><div class="toolbar"><button data-act="settings">Edit practice name</button><button data-act="backup">Export JSON backup</button><button data-act="restore">Restore backup</button><button data-act="csv">Export CSV register</button></div>`}

document.addEventListener('click',async e=>{let action=e.target.closest('button')?.dataset.act;if(!action)return;try{if(!cloudReady&&['cloud-health','cloud-selfmail','cloud-retry-save','cloud-reload','cloud-repair','cloud-refresh','cloud-compose'].includes(action)){if($('#modal').open)closeModal();accountModal();return}switch(action){case 'cloud-connect':if($('#modal').open)closeModal();await bootCloud();break;case 'cloud-create-now':{let button=e.target.closest('button');if(button.disabled)break;button.disabled=true;button.textContent='Creating / connecting...';try{let connected=await rpc('pdCreateWorkspace');if($('#modal').open)closeModal();applyRemote(connected);$('#cloud-start')?.remove();toast('Your personal database is connected.')}catch(err){button.disabled=false;button.textContent='Create my Google Sheets database';throw err}break}case 'cloud-account':accountModal();break;case 'cloud-compose':composeEmail();break;case 'cloud-selfmail':composeEmail(true);break;case 'cloud-health':{let r=await rpc('pdSelfTest');$('#cloud-health-output').textContent=JSON.stringify(r,null,2);break}case 'cloud-repair':await rpc('pdRepairViews');toast('Readable tabs repaired.');break;case 'cloud-retry-save':cloudError='';await drainCloud();toast(cloudError||'Save queue processed.');break;case 'cloud-reload':if(cloudSaving){toast('Wait for the current save to finish before reloading.');break}if(confirm('Reload your saved Sheet data? Export local unsaved changes first. Unsaved changes will be discarded.')){closeModal();applyRemote(await rpc('pdBootstrap'))}break;case 'cloud-refresh':{let r=await rpc('pdBootstrap');cloudInfo=r;cloudLastSync=new Date().toISOString();render();toast('Email status refreshed.');break}}}catch(err){toast(err.message)}});
window.addEventListener('beforeunload',e=>{if(cloudSaving||cloudCurrent||cloudPending){e.preventDefault();e.returnValue='Changes are not yet saved.'}});
setInterval(()=>void pollCloud(),15000);

const CLOUD_BRIEF=`<div class="eyebrow">AICA Level 2 | Capstone project</div><h1>PracticeDesk Google Edition</h1><p><strong>Created by Dipal</strong> | Release 2.1 | 16 November 2026</p><h2>Problem and solution</h2><p>CA teams must track client documents received in stages, prepare focused reminders and retain follow-up outcomes. PracticeDesk combines assignment-level checklists, a Google Sheets database, direct email submission and a status dashboard.</p><h2>Implemented architecture</h2><p>The interface is served by Google Apps Script. Each signed-in Google user has a separately created Sheet identified through that user's script properties. Deployment executes as the accessing user. Server-side identity checks reject a mismatch between the active and effective accounts.</p><p>Settings, clients, assignments, documents and contacts are stored in versioned, checksum-verified snapshots within Google Sheets. Separate readable tabs are generated for review. Updates are made through the app. Direct changes to the readable tabs do not update the authoritative snapshots.</p><h2>Email and live status</h2><p>The user reviews recipient, subject and message, explicitly confirms the send, and MailApp submits the email as the authorized account. The sender is not an editable From address. A persistent request ID prevents resubmission of the same request; identical content is blocked for ten minutes. A send reservation is recorded before MailApp is invoked.</p><p>Sent (accepted) confirms only acceptance of the send operation. Sending / Unknown must be checked before any new send; delivery and read status are not tracked. A failed or interrupted email operation is never automatically retried. Live refresh is 15-second polling while the page is open and idle, not an instant push service. Document receipt and review remain staff-entered statuses.</p><h2>Independent assessment</h2><p>The assessor opens the deployed /exec link in a separate Google browser profile, authorizes their own account; the app automatically creates their personal database. They can add fictional clients and use Account → Test email to myself. They do not enter or receive the owner's password and cannot use the owner's sending identity through the app.</p><h2>Five-minute demonstration</h2><ol><li>Show the signed-in account, allow automatic database setup and open its Sheet.</li><li>Add a fictional client and an audit assignment; update one requirement from Pending to Partially received.</li><li>Show the matching Sheet records and the saved revision indicator; refresh the browser and confirm persistence.</li><li>Review a reminder and submit a test email to your own account. Inspect Email log and verify the mailbox independently.</li><li>Log contact, schedule the next follow-up and show the follow-up desk.</li><li>Use a second Google account to demonstrate a separate empty workspace.</li></ol><h2>Verification evidence</h2><p>The package includes reproducible Node tests and TEST_RESULTS.json. Server tests use simulated Sheets, identity, locks, user properties and mail. They do not prove that Google's authorization, deployment, quotas or actual email delivery will succeed. The setup checklist must be completed with the owner and a second authorized account before assessment.</p><h2>AI's role and professional judgment</h2><p>AI assisted requirements analysis, code generation and test preparation. This release uses deterministic tracking rules and reminder templates. There is no live language-model integration. The practitioner remains responsible for requirement applicability, document review and outgoing communication.</p><h2>Controls and limits</h2><p>Optimistic revisions reject stale saves. Save retries reuse request IDs. Incomplete writes do not become committed snapshots. Corrupt committed data fails closed. Formula-like text is escaped in readable Sheets views and CSV exports. Demo mode does not save to the live database or send email.</p><p>This is a per-user capstone prototype, not a shared-team production system. It needs internet, Google authorization and available quotas. Workspace size is limited to approximately 1 MB of serialized data and 1,000 clients / assignments, with at most 10,000 document or contact records. Snapshot history grows with saves and requires future archival design for sustained use. Do not edit or delete system tabs, share your database, or treat editable logs as tamper-proof evidence.</p><h2>Pre-submission acceptance</h2><p>Pass account authorization, database creation, saved-state reload, a real self-addressed email, second-account isolation, conflict handling and backup export. A video and the offline edition are presentation fallbacks; they do not establish that the Google integration passed.</p>`;
function briefFile(){return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PracticeDesk Google Edition | Project Brief</title><style>body{font:14px/1.7 Segoe UI,Arial,sans-serif;color:#17383b;max-width:950px;margin:40px auto;padding:0 24px}h1{font-size:32px}h2{font-size:20px;margin-top:26px}.eyebrow{color:#19765e;letter-spacing:1px}@page{size:A4;margin:18mm}@media print{body{margin:0;padding:0;font-size:11pt}h2{break-after:avoid}}</style><body>'+CLOUD_BRIEF+'</body></html>'}
function capstoneView(){return pageHead('Submission support','Google Edition project brief.','Accurate scope, assessor workflow and test boundaries.',`<button data-act="google-brief">Download brief</button><button data-act="print">Print / Save PDF</button>`)+`<article class="card"><div class="card-body guide">${CLOUD_BRIEF}</div></article>`};
guide=function(){return pageHead('Google Edition quick guide','Your daily workflow.','Google Sheets storage and account-based email.',`<button data-act="cloud-account">Account & checks</button>`)+`<div class="grid2 guide"><section class="card"><div class="card-head"><h2>Work with clients</h2></div><div class="card-body"><ol><li>Confirm your Google account in the header. Set your practice name through Practice settings.</li><li>Add or import clients using the CSV template. Invalid and duplicate rows are shown before import.</li><li>Create an assignment, choose a starter checklist and tailor the requirements to your engagement.</li><li>Track Pending, Partial, Received and Reviewed separately. Optional and Not applicable items are excluded from required counts.</li><li>Collection dates are internal targets, not statutory deadlines. Blank document dates inherit the assignment date.</li><li>Wait for Saved before closing. Export JSON backups regularly.</li></ol><h3>Email and follow-up</h3><p>Open an assignment, choose Send email, review the recipient and content, then tick the authorization checkbox. The app submits through your signed-in account. Draft-only reminders remain available. Manually record actual contact and set the next follow-up date.</p><p>Demo is isolated: it makes no live saves and sending is disabled. Exit demo before testing your own email.</p><div class="toolbar"><button data-act="settings">Practice settings</button><button data-act="demo">Explore demo</button></div></div></section><section class="card"><div class="card-head"><h2>Live status and recovery</h2></div><div class="card-body"><p>Open pages poll for new data every 15 seconds when idle. Polling pauses during edits, saves, dialogs and email submission. There are no background reminders when the page is closed.</p><p>Sending means submission started. Sent (accepted) means the sending call returned successfully. Unknown means the outcome is uncertain. Delivery, bounce and read status are not available.</p><p>If saving fails, retain the page and export a local backup. Retry save in Account uses the same request ID. A conflict requires exporting local changes and reloading the saved Sheet data. Do not blindly restore over a colleague's changes.</p><p>Readable Sheet tabs are generated views. Make changes through PracticeDesk. _Snapshots and _Meta are system tabs; do not alter them. Sheet sharing bypasses the app's isolation, so keep your database private.</p><p>Each Google user has a separate workspace. This release does not provide a shared team database. No Google passwords are entered or stored.</p><p>Account checks verify access and snapshot integrity but do not send an email. Test email to myself requires a separate explicit send confirmation.</p></div></section></div>`};
